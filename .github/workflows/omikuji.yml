# おみくじ帳 PWA を GitHub Pages へ公開する。
# ビルド工程はない（素の HTML/CSS/ES modules）。omikuji/app をそのまま配る。
name: omikuji Pages

on:
  push:
    branches: [main]
    paths:
      - 'omikuji/app/**'
      - '.github/workflows/omikuji.yml'
  pull_request:
    paths:
      - 'omikuji/app/**'
      - '.github/workflows/omikuji.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ビルドを挟まない構成なので、壊れても実行するまで分からない。
      # 実際に起きた事故（import 名の食い違い、SW の先読み漏れ）を関所で止める。
      - name: 公開前の点検
        run: node omikuji/scripts/check.mjs

      - name: JavaScript の構文
        run: |
          for f in omikuji/app/js/*.js; do
            node --check "$f" || { echo "構文エラー: $f"; exit 1; }
          done
          echo "構文 OK"

      # 暦と占いは目で見ても正しさが分からない。
      # 旧暦は原典（qreki_py）と、六星占術は出典の運命数表と突き合わせる。
      - name: 旧暦と暦注の検算
        run: node omikuji/scripts/verify-koyomi.mjs

      - name: 占いの検算
        run: node omikuji/scripts/verify-fortune.mjs

  deploy:
    # main への push のときだけ公開する
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: omikuji/app
      - id: deployment
        uses: actions/deploy-pages@v4
