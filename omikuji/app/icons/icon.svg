<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#F4F0E6"/>
  <!-- 鳥居を4本の線で。要素を足すほど小さい表示で潰れる -->
  <g stroke="#C3352E" stroke-width="30" stroke-linecap="round" fill="none">
    <!-- 笠木: 反りが鳥居の顔になる -->
    <path d="M104 146 C 160 100, 352 100, 408 146"/>
    <!-- 貫: 柱の外へはっきり出す -->
    <line x1="140" y1="232" x2="372" y2="232"/>
    <!-- 柱: 下端近くまで伸ばして地に立たせる -->
    <line x1="178" y1="144" x2="158" y2="440"/>
    <line x1="334" y1="144" x2="354" y2="440"/>
  </g>
</svg>
